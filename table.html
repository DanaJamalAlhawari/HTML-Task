<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Table Page</title>
</head>

<body>

    <table border="4" cellpadding="20" cellspacing="4" width="400">

        <tr>
            <th>Name</th>
            <th>Age</th>
            <th>Height</th>
        </tr>

        <tr>
            <td>Ahmed</td>
            <td>20</td>
            <td>173</td>
        </tr>

        <tr>
            <td colspan="2" bgcolor="yellow">
                double col span</td>
            <td>A</td>
        </tr>

        <tr>
            <td rowspan="2">row span</td>
            <td>B</td>
            <td>C</td>
        </tr>

        <tr>
            <td>f</td>
            <td>c</td>
        </tr>

    </table>
    <br>

    

</body>

</html>
