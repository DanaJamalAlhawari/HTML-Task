<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Application Form</title>
</head>

<body>
<h1>Application Form</h1>

    <form>

        <label for="firstName">First Name:</label>
        <input type="text" id="firstName" name="firstName">

        <label for="lastName">Last Name:</label>
        <input type="text" id="lastName" name="lastName">

        <br><br>

        <label for="birthDate">Date of birth:</label>
        <input type="date" id="birthDate" name="birthDate">

        <label for="age">Age:</label>
        <input type="number" id="age" name="age">

        <br><br>

        <label for="gender">Gender:</label>

        <select id="gender" name="gender">
             
            <option value="male">Male</option>
            <option value="female">Female</option>
           
        </select>

        <label for="email">Email Address:</label>
        <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter email address"
        >

        <br><br>

        <span>Positions Available:</span>

        <input type="radio" id="junior" name="position" value="junior">
        <label for="junior">Junior Developer</label>

        <input type="radio" id="mid" name="position" value="mid">
        <label for="mid">Mid-level Developer</label>

        <input type="radio" id="senior" name="position" value="senior">
        <label for="senior">Senior Developer</label>

        <br><br>

        <span>Programming Languages:</span>

        <input type="checkbox" id="java" name="languages" value="java">
        <label for="java">Java</label>

        <input type="checkbox" id="javascript" name="languages" value="javascript">
        <label for="javascript">JavaScript</label>

        <input type="checkbox" id="python" name="languages" value="python">
        <label for="python">Python</label>

        <br><br>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password">

        <label for="confirmPassword">Confirm Password:</label>
        <input
            type="password"
            id="confirmPassword"
            name="confirmPassword"
        >

        <br><br>

        <button type="submit">Submit</button>
        <button type="reset">Reset</button>

    </form>
</body>

</html>
